services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: selfmail-minio-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: selfmail
      MINIO_ROOT_PASSWORD: selfmail-local-secret
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 selfmail selfmail-local-secret
        mc mb --ignore-existing local/workspace-images
        mc anonymous set download local/workspace-images

  postgres:
    image: postgres:16-alpine
    container_name: selfmail-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=selfmail
      - POSTGRES_PASSWORD=selfmail
      - POSTGRES_DB=selfmail
      - TZ=${TZ:-UTC}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfmail"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: selfmail-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rspamd:
    image: rspamd/rspamd:latest
    container_name: selfmail-rspamd-dev
    restart: unless-stopped
    ports:
      - "11332:11332" # Proxy/Milter
      - "11333:11333" # HTTP/JSON API
      - "11334:11334" # Web UI
    volumes:
      - ./rspamd/etc:/etc/rspamd
      - ./rspamd/var:/var/lib/rspamd
    environment:
      - TZ=${TZ:-UTC}

  clamav:
    image: clamav/clamav:latest
    platform: linux/amd64
    container_name: selfmail-clamav-dev
    restart: unless-stopped
    ports:
      - "3310:3310"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - clamav-data:/var/lib/clamav

volumes:
  minio-data:
  postgres-data:
  redis-data:
  clamav-data:
