    <g font-size="15"><text x="86" y="132">A little less inbox. A little more you.</text><text x="86" y="252">Coffee and a good idea?</text><text x="86" y="372">The first sketches are ready</text><text x="86" y="492">Out of office, into the mountains</text></g>
